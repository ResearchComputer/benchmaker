[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmaker"
version = "0.1.0"
description = "Async HTTP benchmarking utility with pluggable workloads and load models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Xiaozhe Yao" }]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "datasets>=4.8.5",
    "huggingface-hub>=1.16.4",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0",
    "swebench>=4.1.0",
    # SWE-bench evaluation runs through harbor (the `benchmaker swebench` recipe).
    # harbor has no PyPI release — it's the local research package. A bare
    # `harbor` requirement would risk pulling an unrelated PyPI project, so we
    # pin the local checkout directly. Adjust the path for your environment, or
    # install it editable yourself: `pip install -e <path-to>/research/harbor`.
    "harbor @ file:///pub/scratch/xiayao/research/harbor",
]

[project.optional-dependencies]
rich = ["rich>=13"]
hf = ["datasets>=2.18"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
benchmaker = "benchmaker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmaker*"]

[tool.setuptools.package-data]
# Ship the pi bash-override extension (Mode 2) inside the wheel.
"benchmaker.swebench" = ["pi_ext/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
