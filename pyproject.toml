[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmaker"
version = "0.1.0"
description = "Async HTTP benchmarking utility with pluggable workloads and load models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Xiaozhe Yao" }]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "datasets>=4.8.5",
    "huggingface-hub>=1.16.4",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0",
    "swebench>=4.1.0",
]

[project.optional-dependencies]
rich = ["rich>=13"]
hf = ["datasets>=2.18"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
benchmaker = "benchmaker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmaker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
