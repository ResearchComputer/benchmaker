[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmaker"
version = "0.1.2"
description = "Async HTTP benchmarking utility with pluggable workloads and load models."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Xiaozhe Yao" }]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "datasets>=4.8.5",
    "huggingface-hub>=1.16.4",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0",
    "swebench>=4.1.0",
    # NOTE: The `benchmaker swebench` recipe also needs `harbor`, the local
    # research package. It has no PyPI release and can't be declared here — PyPI
    # rejects direct (file://, git+, https) references in published metadata, and
    # a bare `harbor` would risk pulling an unrelated PyPI project. Install it
    # manually for that recipe: `pip install -e <path-to>/research/harbor`.
]

[project.optional-dependencies]
rich = ["rich>=13"]
hf = ["datasets>=2.18", "transformers>=4.40"]
tokenizer = ["transformers>=4.40"]  # subset of [hf]; use when you don't need datasets
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
plot = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[project.scripts]
benchmaker = "benchmaker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmaker*"]

[tool.setuptools.package-data]
# Ship the pi bash-override extension (Mode 2) inside the wheel.
"benchmaker.swebench" = ["pi_ext/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
