# LLM benchmark driven by .env (loaded automatically by `bench-maker run`).
#
# Required env vars (set in .env or shell):
#   OPENAI_COMPATIBLE_MODEL   — e.g. swiss-ai/Apertus-8B-Instruct-2509
#   OPENAI_API_BASE_URL       — e.g. https://api.swissai.svc.cscs.ch/v1/
#   OPENAI_API_KEY            — bearer token
#
# Run:
#   bench-maker run examples/config_llm_env.yaml \
#       --out-dir ./runs --run-id apertus-baseline --label variant=v0

workload_type:
  type: openai
  # ${VAR} interpolation works in any string field; %v1% trailing slash is OK.
  url: "${OPENAI_API_BASE_URL}chat/completions"
  model: "${OPENAI_COMPATIBLE_MODEL}"
  api_key: "${OPENAI_API_KEY}"
  max_tokens: 64
  temperature: 0.0

workload:
  type: static
  items:
    - "Write a one-sentence fun fact about distributed systems."
    - "Explain RDMA in one paragraph."
    - "What is speculative decoding?"
    - "Name three trade-offs of paged attention."
  shuffle: true
  seed: 0

# Open-loop Poisson at 2 rps for 20 seconds. Adjust as needed.
load: poisson:2
duration: 20s
timeout_s: 120
